name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # No local.properties on CI, so this compiles and verifies against a downloaded 2025.3.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: ./gradlew build :plugin:verifyPlugin --console=plain

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports
          path: plugin/build/reports/pluginVerifier
          if-no-files-found: ignore
